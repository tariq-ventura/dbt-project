name: 'suntech_datawarehouse'
version: '1.0.0'
config-version: 2

profile: 'suntech'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  suntech_datawarehouse:
    staging:
      +materialized: view
      +schema: staging
    
    dimensions:
      +materialized: table
      +schema: dimensions
    
    facts:
      +materialized: incremental
      +schema: facts
      +on_schema_change: "append_new_columns"